{
  "openapi": "3.1.0",
  "info": {
    "title": "PacketMotion Fabric Controller",
    "version": "0.2.0",
    "description": "Single-customer Next.js controller, operator inventory and outbound HTTPS/mTLS management agent MVP. Config received is not network applied."
  },
  "paths": {
    "/api/branding/logo": {
      "get": {
        "operationId": "getBrandLogo",
        "description": "Returns only the configured brand image. The asset is public so the login page can display it.",
        "responses": {
          "200": {
            "description": "Logo image; response is not cached.",
            "content": {
              "image/png": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "image/jpeg": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "image/webp": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "404": {
            "description": "No custom logo is configured."
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "put": {
        "operationId": "saveBrandLogo",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Superadmin only. Requires an exact same-origin Origin header. Accepts PNG/JPEG/WebP up to 2 MiB.",
        "requestBody": {
          "required": true,
          "content": {
            "image/png": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            },
            "image/jpeg": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            },
            "image/webp": {
              "schema": {
                "type": "string",
                "format": "binary"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Logo saved."
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "delete": {
        "operationId": "removeBrandLogo",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Superadmin only. Requires an exact same-origin Origin header.",
        "responses": {
          "200": {
            "description": "Logo removed; the default mark is displayed."
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/operator/operators": {
      "get": {
        "operationId": "listOperators",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Admin and superadmin only. Lists operator email addresses, roles, and creation dates.",
        "responses": {
          "200": {
            "description": "Operator accounts."
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "post": {
        "operationId": "createOperator",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Requires exact same-origin Origin. Superadmins may create admins or viewers; admins may create viewers only. Returns a generated password once.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "email"
                ],
                "properties": {
                  "email": {
                    "type": "string",
                    "format": "email",
                    "maxLength": 254
                  },
                  "role": {
                    "type": "string",
                    "enum": [
                      "admin",
                      "viewer"
                    ]
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Operator created; includes the generated password exactly once."
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/operator/controller-settings/insecure-http-hosts": {
      "get": {
        "operationId": "getInsecureHttpHosts",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Superadmin only. Returns the private controller IPs that may be shown in HTTP lab enrollment commands.",
        "responses": {
          "200": {
            "description": "Configured host allowlist."
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "put": {
        "operationId": "replaceInsecureHttpHosts",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Superadmin only; exact same-origin JSON request. Allows at most 64 private IPv4/IPv6 or loopback addresses. The list controls generated UI instructions; HTTP remains unencrypted and is for isolated labs only.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "hosts"
                ],
                "properties": {
                  "hosts": {
                    "type": "array",
                    "maxItems": 64,
                    "uniqueItems": true,
                    "items": {
                      "type": "string",
                      "format": "ip"
                    }
                  }
                }
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Allowlist replaced."
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/operator/sites": {
      "get": {
        "operationId": "listSites",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "responses": {
          "200": {
            "description": "Persisted sites. Response is never cached.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "sites"
                  ],
                  "properties": {
                    "sites": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Site"
                      }
                    }
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "post": {
        "operationId": "createSite",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Admin only. Requires Origin exactly matching controller origin (CONTROLLER_PUBLIC_ORIGIN when set); cross-site requests denied. JSON body limited to 8192 bytes. Canonical unicast IPv4 prefixes cannot overlap existing sites. lanPrefix is optional at inventory stage.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SiteInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Site and audit committed together.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "site"
                  ],
                  "properties": {
                    "site": {
                      "$ref": "#/components/schemas/Site"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/operator/nodes": {
      "get": {
        "operationId": "listNodes",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "responses": {
          "200": {
            "description": "Persisted nodes. Response is never cached.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "nodes",
                    "total",
                    "page",
                    "pageSize"
                  ],
                  "properties": {
                    "nodes": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Node"
                      }
                    },
                    "total": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "page": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "pageSize": {
                      "type": "integer",
                      "enum": [
                        10,
                        25,
                        50,
                        100
                      ]
                    }
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "400": {
            "$ref": "#/components/responses/Error"
          }
        },
        "description": "Authenticated asynchronous inventory. Literal case-insensitive substring search by device name or Edge/Hub type. Stable name/id ordering; bounded server pagination; out-of-range page clamps to last page. Status separates pending enrollment, active enrollment, configuration receipt, management heartbeat, and offline/revoked states. No tokens returned.",
        "parameters": [
          {
            "name": "search",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 100,
              "default": ""
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000,
              "default": 1
            }
          },
          {
            "name": "pageSize",
            "in": "query",
            "schema": {
              "type": "integer",
              "enum": [
                10,
                25,
                50,
                100
              ],
              "default": 25
            }
          }
        ]
      },
      "post": {
        "operationId": "createNode",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Admin only; same Origin and JSON size requirements as createSite. Supply mode and optional lanPrefix to register a device and its internal network in one atomic transaction; legacy siteId registration remains supported. Branch is the wire value for an Edge device. Creates a 15-minute one-use enrollment token and initial typed desired revision; the agent only stages and acknowledges receipt, it does not apply network configuration.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/NodeInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Node and audit committed together.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "node",
                    "enrollment"
                  ],
                  "properties": {
                    "node": {
                      "$ref": "#/components/schemas/Node"
                    },
                    "enrollment": {
                      "$ref": "#/components/schemas/EnrollmentToken"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/agent/v1/enroll": {
      "post": {
        "operationId": "agentEnroll",
        "security": [],
        "description": "One-use token and signed CSR over server-authenticated HTTPS through trusted ingress.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Enroll"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Accepted",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Enrolled"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/agent/v1/heartbeat": {
      "post": {
        "operationId": "agentHeartbeat",
        "security": [
          {
            "deviceCertificate": []
          }
        ],
        "description": "Identity/node scope comes from mTLS; no caller-selected node ID.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Heartbeat"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Accepted",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "accepted"
                  ],
                  "properties": {
                    "accepted": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/agent/v1/desired": {
      "get": {
        "operationId": "agentDesired",
        "security": [
          {
            "deviceCertificate": []
          }
        ],
        "description": "Identity/node scope comes from mTLS; no caller-selected node ID. Optional revision and checksum return an unchanged marker only when both match; wait holds the authenticated request for up to 25 seconds and returns promptly when a newer durable revision is published. Older clients continue receiving the complete payload.",
        "responses": {
          "200": {
            "description": "Accepted",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "$ref": "#/components/schemas/Desired"
                    },
                    {
                      "$ref": "#/components/schemas/DesiredUnchanged"
                    }
                  ]
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        },
        "parameters": [
          {
            "name": "revision",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "checksum",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "pattern": "^[a-f0-9]{64}$"
            }
          },
          {
            "name": "wait",
            "in": "query",
            "required": false,
            "description": "Maximum desired-revision wait in seconds. The server caps waits at 25 seconds.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 25
            }
          }
        ]
      }
    },
    "/api/agent/v1/ack": {
      "post": {
        "operationId": "agentAck",
        "security": [
          {
            "deviceCertificate": []
          }
        ],
        "description": "Identity/node scope comes from mTLS; no caller-selected node ID.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Ack"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Accepted",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "accepted"
                  ],
                  "properties": {
                    "accepted": {
                      "type": "boolean"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
