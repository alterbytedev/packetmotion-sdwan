          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "post": {
        "operationId": "createSite",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Admin only. Requires Origin exactly matching controller origin (CONTROLLER_PUBLIC_ORIGIN when set); cross-site requests denied. JSON body limited to 8192 bytes. Canonical unicast IPv4 prefixes cannot overlap existing sites. lanPrefix is optional at inventory stage.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SiteInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Site and audit committed together.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "site"
                  ],
                  "properties": {
                    "site": {
                      "$ref": "#/components/schemas/Site"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/operator/nodes": {
      "get": {
        "operationId": "listNodes",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "responses": {
          "200": {
            "description": "Persisted nodes. Response is never cached.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "nodes",
                    "total",
                    "page",
                    "pageSize"
                  ],
                  "properties": {
                    "nodes": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Node"
                      }
                    },
                    "total": {
                      "type": "integer",
                      "minimum": 0
                    },
                    "page": {
                      "type": "integer",
                      "minimum": 1
                    },
                    "pageSize": {
                      "type": "integer",
                      "enum": [
                        10,
                        25,
                        50,
                        100
                      ]
                    }
                  }
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "400": {
            "$ref": "#/components/responses/Error"
          }
        },
        "description": "Authenticated asynchronous inventory. Literal case-insensitive substring search by device name or Edge/Hub type. Stable name/id ordering; bounded server pagination; out-of-range page clamps to last page. No tokens returned.",
        "parameters": [
          {
            "name": "search",
            "in": "query",
            "schema": {
              "type": "string",
              "maxLength": 100,
              "default": ""
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000,
              "default": 1
            }
          },
          {
            "name": "pageSize",
            "in": "query",
            "schema": {
              "type": "integer",
              "enum": [
                10,
                25,
                50,
                100
              ],
              "default": 25
            }
          }
        ]
      },
      "post": {
        "operationId": "createNode",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Admin only; same Origin and JSON size requirements as createSite. Supply mode and optional lanPrefix to register a device and its internal network in one atomic transaction; legacy siteId registration remains supported. Branch is the wire value for an Edge device. No enrollment or networking side effects.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/NodeInput"
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Node and audit committed together.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "node",
                    "enrollment"
                  ],
                  "properties": {
                    "node": {
                      "$ref": "#/components/schemas/Node"
                    },
                    "enrollment": {
                      "$ref": "#/components/schemas/EnrollmentToken"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
