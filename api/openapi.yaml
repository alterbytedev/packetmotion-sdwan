      }
    },
    "/api/operator/nodes/{id}": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": { "type": "string", "format": "uuid" }
        }
      ],
      "patch": {
        "operationId": "renameOperatorDevice",
        "security": [{ "operatorSession": [] }],
        "description": "Admin only; same-origin Origin, JSON and 8192-byte limit required. Renames an active Edge or Hub; the name must be unique within its site.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": ["name"],
                "properties": { "name": { "type": "string", "minLength": 1, "maxLength": 100 } }
              }
            }
          }
        },
        "responses": {
          "201": { "description": "Device renamed." },
          "400": { "$ref": "#/components/responses/Error" },
          "401": { "$ref": "#/components/responses/Error" },
          "403": { "$ref": "#/components/responses/Error" },
          "404": { "$ref": "#/components/responses/Error" },
          "409": { "$ref": "#/components/responses/Error" },
          "503": { "$ref": "#/components/responses/Error" }
        }
      },
      "delete": {
        "operationId": "archiveOperatorDevice",
        "security": [{ "operatorSession": [] }],
        "description": "Admin only; same-origin Origin required. Archives an Edge or Hub, revokes its credentials, and withdraws active peer plans. Audit history and WireGuard address/port reservations are retained. Local tunnel state on a disconnected device may persist until local cleanup.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [],
                "properties": {}
              }
            }
          }
        },
        "responses": {
          "201": { "description": "Device archived." },
          "401": { "$ref": "#/components/responses/Error" },
          "403": { "$ref": "#/components/responses/Error" },
          "404": { "$ref": "#/components/responses/Error" },
          "503": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/operator/nodes/{id}/enrollment": {
      "parameters": [
        {
          "name": "id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "format": "uuid"
          }
        }
      ],
      "post": {
        "operationId": "operatorenrollmentpost",
        "security": [
          {
            "operatorSession": []
          }
        ],
        "description": "Admin only; same-origin Origin, JSON and 8192-byte limit required. Issues a replacement token for pending enrollment. If the prior token was consumed but the device has never sent a heartbeat, revokes its issued certificate and resets enrollment before issuing a replacement. Active devices cannot be reset through this recovery path.",
        "requestBody": {
