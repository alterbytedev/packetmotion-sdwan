  "components": {
    "securitySchemes": {
      "operatorSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "sdwan-session"
      },
      "deviceCertificate": {
        "type": "mutualTLS",
        "description": "Agent client certificate verified at trusted NGINX ingress; device revocation/expiry checked by controller on every request. Clients never supply proxy identity headers."
      }
    },
    "responses": {
      "Error": {
        "description": "Rejected request or unavailable inventory. See HTTP status for category.",
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "required": [
                "error"
              ],
              "properties": {
                "error": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "schemas": {
      "SiteInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "mode"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "mode": {
            "type": "string",
            "enum": [
              "gateway",
              "subnet-router"
            ]
          },
          "lanPrefix": {
            "type": [
              "string",
              "null"
            ],
            "description": "Canonical IPv4 CIDR; null or empty means not recorded yet."
          }
        }
      },
      "Site": {
        "type": "object",
        "required": [
          "id",
          "name",
          "mode",
          "lanPrefix",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "enum": [
              "gateway",
              "subnet-router"
            ]
          },
          "lanPrefix": {
            "type": [
              "string",
              "null"
            ]
          },
          "createdAt": {
            "type": "string",
            "description": "PostgreSQL timestamp text with timezone."
          }
        }
      },
      "NodeInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "kind"
        ],
        "oneOf": [
          {
            "required": [
              "siteId"
            ]
          },
          {
            "required": [
              "mode"
            ]
          }
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "siteId": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "hub",
              "branch"
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "gateway",
              "subnet-router"
            ]
          },
          "lanPrefix": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "Node": {
        "type": "object",
        "required": [
          "id",
          "siteId",
          "siteName",
          "name",
          "kind",
          "createdAt",
          "connectionStatus",
          "configRevision",
          "configStatus",
          "lastSeenAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "siteId": {
            "type": "string",
            "format": "uuid"
          },
          "siteName": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "enum": [
              "hub",
              "branch"
            ]
          },
          "createdAt": {
            "type": "string",
            "description": "PostgreSQL timestamp text with timezone."
          },
          "connectionStatus": {
            "type": "string",
            "enum": [
              "pending",
              "enrolling",
              "syncing",
              "management-connected",
              "offline",
              "revoked"
            ]
          },
          "configRevision": {
            "type": [
              "integer",
              "null"
            ],
            "description": "Latest desired revision; receipt acknowledgement is not network application."
          },
          "configStatus": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "pending",
              "received",
              "rejected",
              "not-configured",
              null
            ]
          },
          "lastSeenAt": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "EnrollmentToken": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "token",
          "expiresAt",
          "controllerUrl"
        ],
        "properties": {
          "token": {
            "type": "string",
            "pattern": "^pm_enroll_[a-f0-9]{64}$"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "controllerUrl": {
            "type": [
              "string",
              "null"
            ]
          },
          "allowInsecureHttp": {
            "type": "boolean"
          },
          "insecureHttpBlocked": {
            "type": "boolean"
          },
          "serverCaSha256": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[A-F0-9]{64}$"
          }
        }
      },
      "Enroll": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "token",
          "csr"
        ],
        "properties": {
          "token": {
            "type": "string",
            "pattern": "^pm_enroll_[a-f0-9]{64}$"
          },
          "csr": {
            "type": "string",
            "maxLength": 8192
          }
        }
      },
      "Enrolled": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "nodeId",
          "kind",
          "certificate",
          "ca",
          "expiresAt",
          "agentUrl"
        ],
        "properties": {
          "nodeId": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "branch",
              "hub"
            ]
          },
          "certificate": {
            "type": "string"
          },
          "ca": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "agentUrl": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "DeviceConfig": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "deviceKind",
          "mode",
          "lanPrefix",
          "pollIntervalSeconds"
        ],
        "properties": {
          "schemaVersion": {
            "type": "integer",
            "enum": [
              1,
              2
            ]
          },
          "deviceKind": {
            "type": "string",
            "enum": [
              "branch",
              "hub"
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "gateway",
              "subnet-router"
            ]
          },
          "lanPrefix": {
            "type": [
              "string",
              "null"
            ]
          },
          "pollIntervalSeconds": {
            "type": "integer",
            "minimum": 10,
            "maximum": 300
          },
          "wireguard": {
            "$ref": "#/components/schemas/WireguardPlan"
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "schemaVersion": {
                  "const": 2
                }
              }
            },
            "then": {
              "required": [
                "wireguard"
              ]
            },
            "else": {
              "not": {
                "required": [
                  "wireguard"
                ]
              }
            }
          }
        ]
      },
      "Desired": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision",
          "payload",
          "checksum"
        ],
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "payload": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/DeviceConfig"
              },
              {
                "type": "null"
              }
            ]
          },
          "checksum": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "Heartbeat": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "eventId",
          "agentVersion",
          "os",
          "arch",
          "uptimeSeconds",
          "interfaces"
        ],
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "agentVersion": {
            "type": "string",
            "maxLength": 64
          },
          "os": {
            "type": "string",
            "maxLength": 64
          },
          "arch": {
            "type": "string",
            "maxLength": 64
          },
          "uptimeSeconds": {
            "type": "integer",
            "minimum": 0
          },
          "interfaces": {
            "type": "array",
            "maxItems": 64,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "up",
                "mtu"
              ],
              "properties": {
                "name": {
                  "type": "string",
                  "maxLength": 64
                },
                "up": {
                  "type": "boolean"
                },
                "mtu": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 1000000
                }
              }
            }
          }
        }
      },
      "Ack": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision",
          "checksum",
          "status"
        ],
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "checksum": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "received",
              "rejected"
            ]
          }
        }
      },
      "DesiredUnchanged": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision",
          "checksum",
          "unchanged"
        ],
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "checksum": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[a-f0-9]{64}$"
          },
          "unchanged": {
            "type": "boolean",
            "const": true
          }
        }
      },
      "WireguardTunnel": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "address",
          "peerAddress",
          "publicKey",
          "endpoint",
          "listenPort",
          "keepalive"
        ],
        "properties": {
          "name": {
            "type": "string",
            "pattern": "^pm[0-9a-f]{12}$"
          },
          "address": {
            "type": "string",
            "description": "Private local IPv4 address with /31 prefix."
          },
          "peerAddress": {
            "type": "string",
            "format": "ipv4"
          },
          "publicKey": {
            "type": "string",
            "pattern": "^[A-Za-z0-9+/]{43}=$"
          },
          "endpoint": {
            "type": [
              "string",
              "null"
            ],
            "description": "Edge: IPv4:UDP-port; Hub: null (learn authenticated peer endpoint)."
          },
          "listenPort": {
            "type": "integer",
            "minimum": 0,
            "maximum": 65535
          },
          "keepalive": {
            "type": "integer",
            "enum": [
              0,
              25
            ]
          }
        }
      },
      "WireguardPlan": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "tunnels"
        ],
        "properties": {
          "tunnels": {
            "type": "array",
            "maxItems": 128,
            "items": {
              "$ref": "#/components/schemas/WireguardTunnel"
            }
          }
        }
      },
      "TunnelSettingsInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "pool",
          "expectedVersion"
        ],
        "properties": {
          "pool": {
            "type": "string",
            "description": "Unused RFC1918 canonical IPv4 CIDR with prefix length 16\u201330. Once reservations exist, changes require an explicit migration."
          },
          "expectedVersion": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2147483647
          }
        }
      },
      "WireguardHubInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "endpoint",
          "basePort",
          "expectedVersion"
        ],
        "properties": {
          "endpoint": {
            "type": "string",
            "format": "ipv4"
          },
          "basePort": {
            "type": "integer",
            "minimum": 1024,
            "maximum": 65408
          },
          "expectedVersion": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2147483647
          }
        }
      },
      "WireguardEdgeInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "hubIds",
          "expectedVersion"
        ],
        "properties": {
          "hubIds": {
            "type": "array",
            "maxItems": 8,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "expectedVersion": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2147483647
          }
        }
      },
      "WireguardStatusInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision",
          "checksum",
          "status",
          "handshakes"
        ],
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 1,
            "maximum": 2147483647
          },
          "checksum": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "status": {
            "type": "string",
            "enum": [
              "disabled",
              "applied",
              "failed"
            ]
          },
          "handshakes": {
            "type": "array",
            "maxItems": 128,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "lastHandshake"
              ],
              "properties": {
                "name": {
                  "type": "string",
                  "pattern": "^pm[0-9a-f]{12}$"
                },
                "lastHandshake": {
                  "type": "integer",
                  "minimum": 0,
                  "description": "Unix seconds; 0 means no handshake observed. Must not exceed controller time by more than 300 seconds."
                }
              }
            }
          }
        }
      },
      "LanProfileInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedVersion",
          "interfaceName",
          "address",
          "advertisedPrefix"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "minimum": 0
          },
          "interfaceName": {
            "type": "string",
            "pattern": "^[a-zA-Z][a-zA-Z0-9_.-]{0,14}$",
            "description": "Physical LAN interface; loopback and pm interfaces rejected. Agent preflight must separately protect its actual management interface."
          },
          "address": {
            "type": "string",
            "description": "Private IPv4 host/prefix 8\u201330; network/broadcast host addresses rejected."
          },
          "advertisedPrefix": {
            "type": "string",
            "description": "Canonical IPv4 subnet; must exactly match the address network."
          }
        }
      },
      "ProtectedNetworksInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "expectedVersion",
          "protectedPrefixes"
        ],
        "properties": {
          "expectedVersion": {
            "type": "integer",
            "minimum": 0
          },
          "protectedPrefixes": {
            "type": "array",
            "minItems": 1,
            "maxItems": 32,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "description": "Canonical unicast IPv4 CIDR."
            }
          }
        }
      }
    }
  }
}
