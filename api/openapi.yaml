          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "operatorSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "sdwan-session"
      },
      "deviceCertificate": {
        "type": "mutualTLS",
        "description": "Agent client certificate verified at trusted NGINX ingress; device revocation/expiry checked by controller on every request. Clients never supply proxy identity headers."
      }
    },
    "responses": {
      "Error": {
        "description": "Rejected request or unavailable inventory. See HTTP status for category.",
        "content": {
          "application/json": {
            "schema": {
              "type": "object",
              "required": [
                "error"
              ],
              "properties": {
                "error": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "schemas": {
      "SiteInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "mode"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "mode": {
            "type": "string",
            "enum": [
              "gateway",
              "subnet-router"
            ]
          },
          "lanPrefix": {
            "type": [
              "string",
              "null"
            ],
            "description": "Canonical IPv4 CIDR; null or empty means not recorded yet."
          }
        }
      },
      "Site": {
        "type": "object",
        "required": [
          "id",
          "name",
          "mode",
          "lanPrefix",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "enum": [
              "gateway",
              "subnet-router"
            ]
          },
          "lanPrefix": {
            "type": [
              "string",
              "null"
            ]
          },
          "createdAt": {
            "type": "string",
            "description": "PostgreSQL timestamp text with timezone."
          }
        }
      },
      "NodeInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "kind"
        ],
        "oneOf": [
          {
            "required": [
              "siteId"
            ]
          },
          {
            "required": [
              "mode"
            ]
          }
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          },
          "siteId": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "hub",
              "branch"
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "gateway",
              "subnet-router"
            ]
          },
          "lanPrefix": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "Node": {
        "type": "object",
        "required": [
          "id",
          "siteId",
          "siteName",
          "name",
          "kind",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "siteId": {
            "type": "string",
            "format": "uuid"
          },
          "siteName": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "kind": {
            "type": "string",
            "enum": [
              "hub",
              "branch"
            ]
          },
          "createdAt": {
            "type": "string",
            "description": "PostgreSQL timestamp text with timezone."
          },
          "connectionStatus": {
            "type": "string",
            "enum": [
              "connected",
              "offline",
              "not-enrolled",
              "revoked"
            ]
          },
          "lastSeenAt": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "EnrollmentToken": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "token",
          "expiresAt",
          "controllerUrl"
        ],
        "properties": {
          "token": {
            "type": "string",
            "pattern": "^pm_enroll_[a-f0-9]{64}$"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "controllerUrl": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "Enroll": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "token",
          "csr"
        ],
        "properties": {
          "token": {
            "type": "string",
            "pattern": "^pm_enroll_[a-f0-9]{64}$"
          },
          "csr": {
            "type": "string",
            "maxLength": 8192
          }
        }
      },
      "Enrolled": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "nodeId",
          "kind",
          "certificate",
          "ca",
          "expiresAt",
          "agentUrl"
        ],
        "properties": {
          "nodeId": {
            "type": "string",
            "format": "uuid"
          },
          "kind": {
            "type": "string",
            "enum": [
              "branch",
              "hub"
            ]
          },
          "certificate": {
            "type": "string"
          },
          "ca": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "agentUrl": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "DeviceConfig": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "deviceKind",
          "mode",
          "lanPrefix",
          "pollIntervalSeconds"
        ],
        "properties": {
          "schemaVersion": {
            "type": "integer",
            "const": 1
          },
          "deviceKind": {
            "type": "string",
            "enum": [
              "branch",
              "hub"
            ]
          },
          "mode": {
            "type": "string",
            "enum": [
              "gateway",
              "subnet-router"
            ]
          },
          "lanPrefix": {
            "type": [
              "string",
              "null"
            ]
          },
          "pollIntervalSeconds": {
            "type": "integer",
            "minimum": 10,
            "maximum": 300
          }
        }
      },
      "Desired": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision",
          "payload",
          "checksum"
        ],
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "payload": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/DeviceConfig"
              },
              {
                "type": "null"
              }
            ]
          },
          "checksum": {
            "type": [
              "string",
              "null"
            ]
          }
        }
      },
      "Heartbeat": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "eventId",
          "agentVersion",
          "os",
          "arch",
          "uptimeSeconds",
          "interfaces"
        ],
        "properties": {
          "eventId": {
            "type": "string",
            "format": "uuid"
          },
          "agentVersion": {
            "type": "string",
            "maxLength": 64
          },
          "os": {
            "type": "string",
            "maxLength": 64
          },
          "arch": {
            "type": "string",
            "maxLength": 64
          },
          "uptimeSeconds": {
            "type": "integer",
            "minimum": 0
          },
          "interfaces": {
            "type": "array",
            "maxItems": 64,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "up",
                "mtu"
              ],
              "properties": {
                "name": {
                  "type": "string",
                  "maxLength": 64
                },
                "up": {
                  "type": "boolean"
                },
                "mtu": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 1000000
                }
              }
            }
          }
        }
      },
      "Ack": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision",
          "checksum",
          "status"
        ],
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "checksum": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "enum": [
              "received",
              "rejected"
            ]
          }
        }
      },
      "DesiredUnchanged": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "revision",
          "checksum",
          "unchanged"
        ],
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "checksum": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "unchanged": {
            "type": "boolean",
            "const": true
          }
        }
      }
    }
  }
}
