    "/api/agent/v1/renew": {
      "post": {
        "operationId": "agentRenew",
        "security": [
          {
            "deviceCertificate": []
          }
        ],
        "description": "Identity/node scope comes from mTLS; no caller-selected node ID.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
